<!DOCTYPE html>
<html lang="en-GB" class="light-theme">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found - Arcane Technologies</title>
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="manifest" href="./site.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-base:       #0a0a0f;
      --purple:        #8b5cf6;
      --purple-dim:    rgba(139, 92, 246, 0.15);
      --purple-glow:   rgba(139, 92, 246, 0.4);
      --text-primary:  #f0eeff;
      --text-muted:    #9997b8;
      --border-subtle: rgba(139, 92, 246, 0.12);
      --font-heading:  'Space Grotesk', sans-serif;
      --font-body:     'Inter', sans-serif;
    }

    html.light-theme {
      --bg-base:       #f8f8ff;
      --purple:        #6d28d9;
      --purple-dim:    rgba(109, 40, 217, 0.08);
      --purple-glow:   rgba(109, 40, 217, 0.25);
      --text-primary:  #0a0a1a;
      --text-muted:    #666677;
      --border-subtle: rgba(109, 40, 217, 0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 700;
      line-height: 1;
      color: var(--purple);
      opacity: 0.18;
      letter-spacing: -0.05em;
      margin-bottom: -1rem;
      user-select: none;
    }

    h1 {
      font-family: var(--font-heading);
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--text-muted);
      max-width: 420px;
      margin-bottom: 2rem;
      line-height: 1.7;
    }

    .home-btn {
      font-family: var(--font-heading);
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1.75rem;
      background: linear-gradient(135deg, var(--purple) 0%, #6d28d9 100%);
      border-radius: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.35);
    }

    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.6);
    }

    .theme-toggle {
      position: fixed;
      top: 1rem; right: 1.5rem;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      background: var(--purple-dim);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <p class="error-code">404</p>
  <h1>This page doesn't exist.</h1>
  <p>The page you're looking for has moved, been deleted, or never existed in the first place. Computers are like that sometimes.</p>
  <a href="/" class="home-btn">← Back to home</a>

</body>
</html>
